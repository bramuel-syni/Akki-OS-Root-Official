izIsReflection }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:6px;border-top:1px solid var(--line);padding-top:16px;\">\n              <div style=\"display:flex;flex-direction:column;gap:0;margin-bottom:18px;\">\n                <sc-for list=\"{{ wizReflectionFields }}\" as=\"f\" hint-placeholder-count=\"4\">\n                  <div style=\"padding:11px 0;border-bottom:1px solid var(--line);\">\n                    <div style=\"font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px;\">{{ f.label }}<\u002Fdiv>\n                    <sc-if value=\"{{ f.isEditing }}\" hint-placeholder-val=\"{{ false }}\">\n                      <input value=\"{{ f.editValue }}\" sc-camel-on-change=\"{{ f.onEditChange }}\" style=\"width:100%;max-width:420px;padding:8px 11px;border:1px solid var(--blue);border-radius:6px;font-size:13px;margin-bottom:7px;\">\n                      <button sc-camel-on-click=\"{{ f.onSave }}\" style=\"padding:5px 11px;border:none;background:var(--blue);color:#fff;border-radius:5px;font-size:11.5px;cursor:pointer;\">Save<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ !f.isEditing }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;\">\n                        <span style=\"font-size:13.5px;color:var(--ink);\">{{ f.value }}<\u002Fspan>\n                        <span sc-camel-on-click=\"{{ f.onEdit }}\" style=\"font-size:11.5px;color:var(--blue);cursor:pointer;flex-shrink:0;\">Change<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ wizGenerate }}\" style=\"padding:11px 20px;border:none;background:var(--blue);color:#fff;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;\">Generate<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ wizIsText }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border-top:1px solid var(--line);padding:14px 38px 18px;background:var(--surface);\">\n          <div style=\"max-width:620px;display:flex;gap:9px;\">\n            <input value=\"{{ wizInput2 }}\" sc-camel-on-change=\"{{ wizInputChange2 }}\" sc-camel-on-key-down=\"{{ wizKeyDown2 }}\" placeholder=\"Type your answer...\" style=\"flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff;\">\n            <button sc-camel-on-click=\"{{ wizSubmitText2 }}\" style=\"padding:11px 20px;border:none;background:var(--blue);color:#fff;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;\">Send<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ docGeneratingOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:320;display:flex;align-items:center;justify-content:center;\">\n      <div style=\"background:#fff;border-radius:14px;padding:30px;max-width:380px;width:90%;\">\n        <div style=\"font-family:var(--head);font-size:17px;margin-bottom:18px;\">{{ docGenTitle }}<\u002Fdiv>\n        <sc-for list=\"{{ docGenStepsView }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px;\">\n            <span style=\"width:20px;height:20px;border-radius:50%;background:{{ g.circleBg }};color:{{ g.circleColor }};border:1.5px solid {{ g.circleBorder }};display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;\">{{ g.mark }}<\u002Fspan>\n            <span style=\"font-size:13px;color:{{ g.textColor }};\">{{ g.label }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:8px;font-size:13px;z-index:400;box-shadow:0 8px 24px rgba(0,0,0,.2);\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst NAV = [\n  { key:'workstudio', label:'WorkStudio', items:[{key:'chat',label:'Chat'},{key:'analyze',label:'Analyze'},{key:'documents',label:'Documents'},{key:'tasks',label:'Task Manager'}] },\n  { key:'thinklab', label:'ThinkLab', items:[{key:'clarity',label:'Seek Clarity'},{key:'strategy',label:'Develop Strategy'},{key:'hypothesis',label:'Simulate a Hypothesis'},{key:'perspective',label:'Get Perspective'}] },\n  { key:'collab', label:'Collab', items:[{key:'mentions',label:'Mentions'},{key:'emails',label:'Emails'},{key:'projects',label:'Projects/Tasks'},{key:'hrstuff',label:'HR Stuff'}] },\n  { key:'monitor', label:'Monitor', items:[{key:'performance',label:'Performance'},{key:'signals',label:'Signals'},{key:'ideas',label:'Ideas by Akki'}] },\n  { key:'trust', label:'Trust Center', items:[{key:'rules',label:'Manage Rules'},{key:'datashield',label:'Data Shield'},{key:'reasoningshield',label:'Reasoning Shield'},{key:'accessshield',label:'Access Shield'}] },\n  { key:'registry', label:'Registry', items:[{key:'estate',label:'Data Estate'},{key:'models',label:'Models'},{key:'compute',label:'Compute'},{key:'connect',label:'Connect'}] },\n  { key:'build', label:'Build', items:[{key:'train',label:'Train Models'},{key:'agentbuild',label:'Build Agents'},{key:'extract',label:'Extract Data'},{key:'youragents',label:'Your Agents'}] },\n  { key:'thirdparty', label:'3rd Party Apps', items:[{key:'appsnew',label:'New'},{key:'appsfrequent',label:'Frequent'},{key:'appsconnected',label:'Connected'},{key:'appsrequests',label:'Requests'}] }\n];\nconst SUB_TO_GROUP = {}; NAV.forEach(g => g.items.forEach(it => { SUB_TO_GROUP[it.key] = g.key; }));\nconst TABS = [\n  { key:'work', label:'Work', groups:['workstudio','thinklab','collab','monitor'] },\n  { key:'build', label:'Build', groups:['build'] },\n  { key:'apps', label:'3rd Party Apps', groups:[] },\n  { key:'admin', label:'Admin', groups:['trust','registry'], right:true }\n];\nconst GROUP_TO_TAB = {}; TABS.forEach(t => t.groups.forEach(g => { GROUP_TO_TAB[g] = t.key; }));\nconst SESSION_TOOLS = ['chat','analyze','documents','tasks','clarity','strategy','hypothesis','perspective'];\nconst LANDING_TIPS = {\n  chat: [\"Every answer traces to a source \\u2014 or says plainly why it can't.\",\"Shield stays on for every call; you choose Auto or Always, never off.\",\"Branch a reply to compare two directions without losing the original.\"],\n  analyze: [\"Rapid answers are instant. Deep Dive spends more to synthesize across files.\",\"Remove a source any time \\u2014 the history log keeps the record honest.\"],\n  documents: [\"Deck or document is decided by the Format \\u0026 Template answer, not a separate fork.\",\"Every AI suggestion is a proposal you apply or discard, never a silent edit.\",\"Intelligence, Signals and Related Documents unlock only after commit.\"],\n  tasks: [\"Akki chases milestones and holds quality against what you named.\",\"Lighter than a commissioned objective \\u2014 no freeze, no ceremony.\"],\n  mentions: [\"A mention carries the thread it came from, not just a notification.\",\"Nothing here leaves the perimeter to reach you.\"],\n  emails: [\"Threads are read inside the shield \\u2014 replying is a governed action.\",\"The list states who owes whom a reply, so nothing sits ambiguous.\"],\n  projects: [\"The same tasks Task Manager tracks, grouped by who else is on them.\",\"Sole-owner items show as such \\u2014 no invented collaborators.\"],\n  hrstuff: [\"Aggregate only. Individual payroll and personnel records are refused by entitlement.\",\"An objective closed as Achieved stays visible rather than disappearing.\"],\n  clarity: [\"Say what's unclear. Akki surfaces what's already known before you decide.\"],\n  strategy: [\"Name the decision ahead of you. Four stages carry it from surface to lock-in.\"],\n  hypothesis: [\"State the hypothesis plainly. Akki stress-tests it against the estate.\"],\n  perspective: [\"Ask for a vantage point other than your own \\u2014 grounded, not invented.\"]\n};\nconst TL_STAGE_LABELS = ['Frame','Name','Challenge','Weigh','Lock-in'];\nconst TL_MODES = [\n  {key:'clarity', num:'01', title:'Seek clarity', objective:'Untangle a messy situation into the two or three questions that actually matter.', duration:'15\\u201320 min'},\n  {key:'strategy', num:'02', title:'Develop strategy', objective:'Build a defensible position \\u2014 options, trade-offs, and the recommendation you would sign.', duration:'25\\u201340 min'},\n  {key:'hypothesis', num:'03', title:'Simulate a hypothesis', objective:'Stress-test a claim before management presents it. What would have to be true?', duration:'20\\u201330 min'},\n  {key:'perspective', num:'04', title:'Get perspectives', objective:'The same problem through the eyes of the audit chair, the CFO, and the sceptical investor.', duration:'15\\u201325 min'}\n];\nconst TL_OUTPUTS = [\n  'A one-page Brief or PDF, exportable in one click.',\n  'A decision trail you can table at the next meeting.',\n  'Optional handoff to Task Manager as tracked work.'\n];\nconst TL_SESSIONS = [\n  {n:'01', mode:'Simulate a hypothesis', title:'Covenant headroom discrepancy \\u2014 committee position', state:'LOCKED IN', line:'Simulate a hypothesis \\u00b7 completed today \\u00b7 Brief exported', control:'Reopen \\u2192'},\n  {n:'02', mode:'Develop strategy', title:'Founder-CEO concentration ahead of IPO filing', state:'IN DEPTH', line:'Develop strategy \\u00b7 paused at Weigh \\u00b7 40 min in', control:'Resume \\u2192'},\n  {n:'03', mode:'Seek clarity', title:'Nairobi payer-mix drift \\u2014 is the plan still credible?', state:'DRAFT', line:'Seek clarity \\u00b7 started 5d ago', control:'Resume \\u2192'},\n  {n:'04', mode:'Seek clarity', title:'Vendor recertification lag \\u2014 what is actually binding?', state:'REFUSED', line:'Seek clarity \\u00b7 refused on evidence \\u00b7 2d ago', control:'Reopen \\u2192'}\n];\nconst TL_STATE_STYLE = {\n  'LOCKED IN':{color:'var(--sage)', mark:'\\u2713 '},\n  'IN DEPTH':{color:'var(--accent)', mark:''},\n  'DRAFT':{color:'var(--ink3)', mark:''},\n  'REFUSED':{color:'var(--oxblood2)', mark:''}\n};\nconst TL_FLOW = {\n  clarity: {\n    probes:[\n      'What situation is unresolved right now? Say it however it sits in your head \\u2014 I\\u2019ll sharpen it with you.',\n      'What have you already ruled out, and what are you still holding open?',\n      'Which of these would change what you do next if it turned out differently?',\n      'If you had to bet, which reading do you think is right \\u2014 and how sure are you?',\n      ''\n    ],\n    frame:['Question established: which of the three open threads is actually load-bearing.','Slice: Q3 vendor scorecard, supplier recertification register, one open Access Shield item.'],\n    candidates:['Candidate A \\u2014 the lag is a documentation problem and closes on schedule.','Candidate B \\u2014 the lag is an ownership problem and will not close without a named owner.','Triangulation: both candidates are supported by the recertification register; only B is supported by the minutes.'],\n    tension:['The scorecard records both suppliers as \"in progress\"; the minutes record one as \"awaiting owner\".','A July correction retracted the earlier \"on track\" note on supplier two. Both readings are held here \\u2014 neither is averaged away.'],\n    weigh:[{cluster:'Ownership is the binding constraint', confidence:'High'},{cluster:'Documentation closes on schedule', confidence:'Medium'},{cluster:'Price is a factor', confidence:'Low \\u2014 not supported'}],\n    conclusion:'The question that matters is not whether the lag closes, but who owns the access-review evidence. That is the only thread without a named owner, and it is the one the audit will test.',\n    loadBearing:['Supplier recertification register, entry 14 (Jul)','Committee minutes, Q2 and Q3 \\u2014 unassigned-owner language','Access Shield open item, access-review evidence'],\n    reflection:['You said you weren\\u2019t certain whether you were diagnosing accurately or pattern-matching. On this one the register supports you.','This stops at the sharpened question. It does not tell you who to assign \\u2014 that is a Develop strategy session.'],\n    refused:null\n  },\n  strategy: {\n    probes:[\n      'What decision are you building toward, and who has to sign it?',\n      'What options are genuinely on the table \\u2014 including the one you would rather not take?',\n      'What would make you abandon your preferred option?',\n      'What is the cost of being wrong, and who carries it?',\n      ''\n    ],\n    frame:['Question established: renegotiate with the incumbent, or qualify a second source.','Slice: critical-path spend by supplier, recertification register, Q3 concentration signal.'],\n    candidates:['Candidate A \\u2014 renegotiate only. Lower near-term cost, concentration unchanged.','Candidate B \\u2014 qualify a second source only. Higher cost, removes single-vendor exposure.','Candidate C \\u2014 run both tracks. Highest cost, fastest de-risking.','Triangulation: A and C are supported by the spend data; B alone is not supported on timeline.'],\n    tension:['The concentration signal says exposure is the binding risk; the budget note says cost is. Both are in the material and they point opposite ways.','A March board note recorded a decision to renegotiate; it was superseded in July without being retracted.'],\n    weigh:[{cluster:'Run both tracks', confidence:'High'},{cluster:'Second source alone', confidence:'Medium'},{cluster:'Renegotiate alone', confidence:'Low'}],\n    conclusion:'Open a second-source qualification track this quarter alongside the renegotiation, not instead of it. Sequence: qualification pack first, pricing conversation second, decision at the August scorecard.',\n    loadBearing:['Critical-path spend by supplier (41% across two)','Q3 concentration signal, second consecutive week','Recertification register, six-to-eight week slip','Superseded March board note'],\n    reflection:['This answers the question a Seek clarity session stops at. It is a recommendation you could sign, and it names its sequence.','The cost case is the weaker half of this. If the budget is genuinely fixed, the recommendation changes.'],\n    refused:null\n  },\n  hypothesis: {\n    probes:[\n      'State the hypothesis plainly \\u2014 as management would put it in the room.',\n      'What would have to be true for it to hold?',\n      'What evidence would falsify it outright?',\n      'Where would you expect the second-order effects to show up first?',\n      ''\n    ],\n    frame:['Hypothesis under test: certification lag, not price, is the leading driver of the vendor risk score.','Slice: Q1\\u2013Q3 risk score history, recertification register, pricing schedule.'],\n    candidates:['Candidate A \\u2014 lag explains the movement; price is incidental.','Candidate B \\u2014 both contribute; lag dominates.','Candidate C \\u2014 price explains the movement; lag is a symptom.','Triangulation: A and B are supported by the score history; C is contradicted by it.'],\n    scenarios:[\n      {name:'Scenario 1 \\u2014 lag closes on schedule', second:'Score recovers by Q4; the pricing conversation loses urgency and the renegotiation weakens.'},\n      {name:'Scenario 2 \\u2014 lag persists past the audit', second:'Score compounds; the audit finding lands in the same cycle as the covenant note, and both reach the board together.'},\n      {name:'Scenario 3 \\u2014 lag closes but price moves', second:'Score recovers while spend rises; concentration risk is unchanged and the second-source case is harder to fund.'}\n    ],\n    tension:['The supplementary note restates headroom at 0.4\\u00d7 against the main pack\\u2019s 0.6\\u00d7. Neither figure is reconciled, and the scenarios read differently under each.','Scenario 2 and Scenario 3 are both supported by the same score history. They are held together here.'],\n    weigh:[{cluster:'Lag dominates', confidence:'High'},{cluster:'Both contribute', confidence:'Medium'},{cluster:'Price dominates', confidence:'Low \\u2014 contradicted'}],\n    conclusion:'The hypothesis holds on the evidence available, with one qualification: the covenant figures are unreconciled, and Scenario 3 cannot be excluded until they are. Treat lag as the primary lever, and do not present the score recovery as settled.',\n    loadBearing:['Q1\\u2013Q3 risk score history','Recertification register, entry 14','Supplementary note 14 \\u2014 unreconciled headroom','Pricing schedule, Q3'],\n    reflection:['A weighted verdict, not a confident one. The unreconciled figures are the reason.','What would change this: a reconciliation memo from the CFO office. It has been requested and has not arrived.'],\n    refused:null\n  },\n  perspective: {\n    probes:[\n      'What problem do you want seen from outside your own seat?',\n      'Whose reading do you most expect to disagree with yours?',\n      'What would you rather they didn\\u2019t ask?',\n      'Which of these views would actually change your decision?',\n      ''\n    ],\n    frame:['Question established: how the vendor concentration position reads from three seats.','Slice: Q3 scorecard, covenant note, recertification register.'],\n    candidates:['Audit chair \\u2014 reads the unassigned ownership as the finding, not the lag.','CFO \\u2014 reads the unreconciled headroom figures as the exposure; concentration is secondary.','Sceptical investor \\u2014 reads the two-supplier dependency as the story and the recertification as noise.','Triangulation: all three are supported by the same material, read from different starting points.'],\n    tension:['The audit chair and the investor agree that the position is under-owned and disagree completely on what is at stake.','The CFO view is the only one that treats the covenant note as primary. It is not contradicted \\u2014 it is differently weighted.'],\n    weigh:[{cluster:'Under-owned governance \\u2014 shared by chair and investor', confidence:'High'},{cluster:'Covenant exposure \\u2014 CFO only', confidence:'Medium'},{cluster:'Recertification as noise \\u2014 investor only', confidence:'Low'}],\n    conclusion:'Two of three seats land on ownership; the third lands on the covenant figures. The blind-spot all three share is the throughput headroom \\u2014 no seat treats it as material, and it is the one thing in the pack that is unambiguously good news.',\n    loadBearing:['Q3 scorecard, supplier concentration','Supplementary note 14','Committee minutes, unassigned-owner language','Inference latency and throughput figures'],\n    reflection:['The object here is the span of views and where they tension \\u2014 not the most probable cause. Do not read this as a single answer.','The shared blind-spot is the finding. Nobody asked about it, which is why it is worth putting in the room.'],\n    refused:null\n  }\n};\nconst THINKLAB_MODES = {\n  clarity: { prompt:\"What feels unresolved right now?\", depth:[\"Three open threads touch this: the Q3 vendor scorecard, recertification of two suppliers, and one open item in Access Shield.\",\"Nothing here is blocked \\u2014 just undecided.\"], synth:\"The unresolved part isn't the data \\u2014 it's which lagging supplier to press first. The one carrying more critical-path spend should go first.\", lockin:\"Press the higher-spend supplier first. Revisit the other in two weeks if it hasn't moved.\" },\n  strategy: { prompt:\"What decision are you building toward?\", depth:[\"Two paths are on the table: renegotiate with the current vendor, or begin qualifying a second source.\",\"Qualifying a second source costs more up front but removes single-vendor exposure.\"], synth:\"Given the concentration risk already flagged in Monitor, qualifying a second source is the stronger long-term position, even at higher near-term cost.\", lockin:\"Open a second-source qualification track this quarter, alongside the renegotiation \\u2014 not instead of it.\" },\n  hypothesis: { prompt:\"What are you willing to test?\", depth:[\"Hypothesis: certification lag, not price, is the leading driver of the risk score.\",\"The estate has enough history to check this directly.\"], synth:\"Checked against Q1\\u2013Q3 records: certification lag explains more of the score's movement than price does, by a wide margin.\", lockin:\"Treat certification lag as the primary lever, not price. Redirect the vendor conversation accordingly.\" },\n  perspective: { prompt:\"What do you already believe, that you want checked?\", depth:[\"Working belief: the risk is concentrated in one region.\",\"The estate shows it's concentrated in one relationship, which happens to sit in that region \\u2014 a narrower claim.\"], synth:\"The region isn't the driver; the relationship is. Reframing it that way changes who should own the fix.\", lockin:\"Reassign ownership from the regional lead to the vendor relationship owner.\" }\n};\nfunction cloneMsg(m){ return JSON.parse(JSON.stringify(m)); }\nfunction stripBranches(m){ const c={...m}; delete c.branches; delete c.branchIndex; return c; }\nfunction startBranchAt(messages, idx, newMsgFields){\n  const old = messages[idx];\n  const oldTail = messages.slice(idx+1).map(cloneMsg);\n  let branches = old.branches ? old.branches.map(b=>({...b})) : [{ msg: stripBranches(old), tail: oldTail }];\n  if (old.branches) branches[old.branchIndex] = { ...branches[old.branchIndex], tail: oldTail };\n  branches.push({ msg: newMsgFields, tail: [] });\n  const branchIndex = branches.length - 1;\n  return messages.slice(0, idx).concat([{ ...newMsgFields, branches, branchIndex }]);\n}\nfunction switchBranchAt(messages, idx, dir){\n  const msg = messages[idx];\n  if (!msg.branches) return messages;\n  const currentTail = messages.slice(idx+1).map(cloneMsg);\n  const branches = msg.branches.map((b,i)=> i===msg.branchIndex ? {...b, tail:currentTail} : b);\n  const newIndex = Math.max(0, Math.min(branches.length-1, msg.branchIndex + dir));\n  const target = branches[newIndex];\n  return messages.slice(0, idx).concat([{ ...target.msg, branches, branchIndex:newIndex }], target.tail.map(cloneMsg));\n}\nfunction answeredMsg(time){\n  return { from:'akki', time, respClass:'answered', lens:'overview',\n    claimText:'We hold', claimHighlight:'214 enterprise contracts', claimRest:'in EMEA currently meeting audit standard.',\n    honesty:'This does not include 18 contracts signed in the last 7 days, pending countersignature.',\n    reasoningUnits:['EMEA contract register (Q3 census)','Audit-standard qualification pass, run Aug 3','Countersignature log'],\n    trail:'Trace ID: TRC-88214-EMEA\\nCensus reflected: Aug 4, 2026\\nStep 1: Estate scoped to EMEA / contracts\\nStep 2: Machine-readable subset isolated (92%)\\nStep 3: Claim compiled against audit-standard qualification',\n    audit:{ line1:'Names, locations, and account identifiers were masked before this went to the model.', line2:'Handled by Claude Sonnet 4.6, inside the governed seam.', exposure:96, dilution:89, purpose:'ANSWER-COMPOSITION-0091', auditId:'AUD-77213-A', receiptId:'TRC-9081-EMEA', closing:'This turn: 2 names and 1 location masked; nothing else altered.' } };\n}\nfunction answeredMsgAlt(time){\n  return { from:'akki', time, respClass:'answered', lens:'overview',\n    claimText:'We hold', claimHighlight:'214 contracts', claimRest:'at audit standard in EMEA as of this week.',\n    honesty:'18 more are signed but awaiting countersignature

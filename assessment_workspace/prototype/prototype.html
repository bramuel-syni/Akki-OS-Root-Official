document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"fd8fe22e-cf9a-4fb2-9e66-50048542edc4\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n@keyframes blinkCursor{0%,50%{opacity:1}51%,100%{opacity:0}}\n@keyframes dotPulse{0%,100%{opacity:.3}50%{opacity:1}}\n@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}\nbody{margin:0}\n::selection{background:rgba(22,39,74,0.18)}\na{color:#16274a}\na:hover{color:#0f1b33}\n*{box-sizing:border-box}\ntextarea,input{outline:none;font-family:inherit}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"--paper:#f5f2ea;--surface:#f0ece1;--surface2:#ede8da;--line:#e4dfd3;--ink:#1b1f27;--ink2:#3d4350;--ink3:#5b6270;--blue:#16274a;--blue2:#0f1b33;--oxblood:#b8395b;--oxblood2:#c64e6e;--brass:#b08d2e;--sage:#1d7a6e;--accent:#4c5fd5;--accent-soft:rgba(76,95,213,.10);--accent-mid:rgba(76,95,213,.22);--head:Iowan Old Style,Georgia,serif;--body:Söhne,Helvetica Neue,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;background:var(--paper);color:var(--ink);font-family:var(--body);min-height:100vh;display:flex;flex-direction:column;\">\n\n  <div style=\"height:52px;flex-shrink:0;background:var(--blue2);display:flex;align-items:center;justify-content:space-between;padding:0 22px;\">\n    <div style=\"font-family:var(--head);font-size:16px;color:var(--paper);letter-spacing:.02em;\">Acme Holdings AI<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:14px;\">\n      <div style=\"font-size:12px;color:#c9c2ae;\">J. Whitfield · Business Development<\u002Fdiv>\n      <div style=\"width:27px;height:27px;border-radius:50%;background:#28345c;display:flex;align-items:center;justify-content:center;font-size:11px;color:#efe9da;flex-shrink:0;\">JW<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;display:flex;min-height:0;\">\n\n    <sc-if value=\"{{ portalMode }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"flex:0 0 45%;min-width:0;background:var(--surface);border-right:1px solid var(--line);padding:24px 34px 50px;overflow-y:auto;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:22px;border-bottom:1px solid var(--line);margin-bottom:24px;padding-bottom:14px;\">\n          <div style=\"display:flex;gap:4px;background:var(--surface2);border-radius:8px;padding:3px;\">\n            <sc-for list=\"{{ navTabsView }}\" as=\"tb\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ tb.onClick }}\" style=\"padding:7px 13px;font-size:12.5px;cursor:pointer;color:{{ tb.color }};font-weight:{{ tb.weight }};border-radius:6px;background:{{ tb.bg }};white-space:nowrap;\">{{ tb.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:4px;background:var(--surface2);border-radius:8px;padding:3px;\">\n            <sc-for list=\"{{ navTabsRightView }}\" as=\"tb\" hint-placeholder-count=\"1\">\n              <div sc-camel-on-click=\"{{ tb.onClick }}\" style=\"padding:7px 13px;font-size:12.5px;cursor:pointer;color:{{ tb.color }};font-weight:{{ tb.weight }};border-radius:6px;background:{{ tb.bg }};white-space:nowrap;\">{{ tb.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ navTabEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:13px;color:var(--ink3);padding:8px 0;\">No integrations surfaced here yet.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ navGroupsView }}\" as=\"grp\" hint-placeholder-count=\"3\">\n          <div style=\"margin-bottom:22px;\">\n            <div style=\"font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8b8371;font-weight:700;margin-bottom:9px;\">{{ grp.label }}<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px;\">\n              <sc-for list=\"{{ grp.items }}\" as=\"item\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ item.onClick }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 11px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;background:{{ item.bg }};color:{{ item.color }};border:1px solid {{ item.borderColor }};box-shadow:{{ item.shadow }};\">\n                  <span style=\"width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:{{ item.iconColor }};background:{{ item.iconBg }};flex-shrink:0;\">{{ item.icon }}<\u002Fspan>\n                  <span>{{ item.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"flex:1 1 55%;min-width:0;overflow-y:auto;padding:30px 38px 60px;\">\n\n      <sc-if value=\"{{ portalMode }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"max-width:600px;animation:fadeIn .25s ease;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;\">\n          <div style=\"padding:30px 34px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:20px;\">\n            <div style=\"min-width:0;\">\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;\">{{ landingGroupLabel }}<\u002Fdiv>\n              <h1 style=\"font-family:var(--head);font-size:32px;font-weight:500;margin:0 0 8px;\">{{ landingAppName }}<\u002Fh1>\n              <div style=\"font-size:14px;color:var(--ink3);line-height:1.55;max-width:56ch;\">{{ landingGreeting }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"width:44px;height:44px;border-radius:12px;background:{{ landingIconBg }};color:{{ landingIconColor }};display:flex;align-items:center;justify-content:center;flex-shrink:0;\">\n              <span style=\"display:inline-flex;transform:scale(1.7);\">{{ landingIcon }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ landingHasHistory }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:22px 34px;border-bottom:1px solid var(--line);\">\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8b8371;margin-bottom:10px;\">{{ landingGlimpseLabel }}<\u002Fdiv>\n              <div style=\"font-size:15px;color:var(--ink);margin-bottom:3px;\">{{ landingGlimpseTitle }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:var(--ink3);\">{{ landingGlimpseMeta }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ landingHasTips }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:22px 34px;border-bottom:1px solid var(--line);\">\n              <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8b8371;margin-bottom:12px;\">Tips<\u002Fdiv>\n              <sc-for list=\"{{ landingTips }}\" as=\"tip\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:8px;line-height:1.5;\"><span style=\"color:var(--ink3);\">·<\u002Fspan><span>{{ tip }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:24px 34px;\">\n            <sc-if value=\"{{ landingHasContinue }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ landingContinue }}\" style=\"padding:11px 20px;background:var(--blue);color:var(--paper);border:none;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;\">{{ landingContinueLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ landingStartNew }}\" style=\"padding:11px 20px;background:{{ landingStartBg }};color:{{ landingStartColor }};border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;\">{{ landingStartLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ landingHasHistory }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size:12.5px;color:var(--ink3);margin-left:4px;\">{{ landingUsage }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ appMode }}\" hint-placeholder-val=\"{{ false }}\">\n\n        <div style=\"display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:24px;\">\n          <button sc-camel-on-click=\"{{ exitApp }}\" style=\"display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;\">← Back<\u002Fbutton>\n          <div style=\"font-family:var(--head);font-size:19px;\">{{ appTitle }}<\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);\">{{ appGroupLabel }}<\u002Fdiv>\n          <sc-if value=\"{{ isChatActive }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;gap:12px;margin-left:auto;min-width:0;\">\n              <div style=\"font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ akkiActiveTitle }}<\u002Fdiv>\n              <span sc-camel-on-click=\"{{ openShieldReport }}\" style=\"display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sage);border:1px solid var(--sage);border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap;flex-shrink:0;\">Shield report<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n\n        <sc-if value=\"{{ isChatActive }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;height:calc(100vh - 156px);max-width:1120px;\">\n            <div style=\"width:220px;flex-shrink:0;border-right:1px solid var(--line);padding-right:14px;display:flex;flex-direction:column;\">\n              <div style=\"display:flex;gap:7px;margin-bottom:12px;\">\n                <button sc-camel-on-click=\"{{ akkiNewConversation }}\" style=\"flex:1;padding:8px 10px;background:var(--blue);color:var(--paper);border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;\">+ New<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ akkiOpenArchive }}\" style=\"padding:8px 10px;background:transparent;border:1px solid var(--line);border-radius:6px;font-size:12px;cursor:pointer;color:var(--ink2);\">Archive<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;\">\n                <sc-for list=\"{{ akkiConversationsView }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <div style=\"position:relative;\">\n                    <sc-if value=\"{{ c.isRenaming }}\" hint-placeholder-val=\"{{ false }}\">\n                      <input value=\"{{ c.renameValue }}\" sc-camel-on-change=\"{{ akkiRenameChange }}\" sc-camel-on-key-down=\"{{ akkiRenameKeyDown }}\" sc-camel-on-blur=\"{{ akkiCommitRename }}\" style=\"width:100%;padding:7px 8px;font-size:12px;border:1px solid var(--blue);border-radius:6px;\">\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ !c.isRenaming }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"padding:7px 8px;border-radius:6px;cursor:pointer;background:{{ c.bg }};display:flex;justify-content:space-between;align-items:center;gap:4px;\">\n                        <div sc-camel-on-click=\"{{ c.onSelect }}\" style=\"min-width:0;flex:1;\">\n                          <div style=\"font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ c.title }}<\u002Fdiv>\n                          <div style=\"font-size:10px;color:var(--ink3);\">{{ c.lastActive }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <span sc-camel-on-click=\"{{ c.onMenu }}\" style=\"flex-shrink:0;color:var(--ink3);font-size:13px;padding:2px 3px;cursor:pointer;\">⋮<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ c.menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"position:absolute;right:0;top:30px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:30;min-width:110px;overflow:hidden;\">\n                        <div sc-camel-on-click=\"{{ c.onRename }}\" style=\"padding:8px 12px;font-size:12px;cursor:pointer;\">Rename<\u002Fdiv>\n                        <div sc-camel-on-click=\"{{ c.onDelete }}\" style=\"padding:8px 12px;font-size:12px;cursor:pointer;color:var(--oxblood2);\">Delete<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;padding-left:26px;\">\n\n              <div style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:16px;\">\n\n                <sc-if value=\"{{ akkiThreadEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-top:30px;\">\n                    <div style=\"font-size:13.5px;color:var(--ink3);max-width:360px;\">Ask anything grounded in your estate — or try one of three real shapes an answer can take:<\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:8px;max-width:400px;\">\n                      <button sc-camel-on-click=\"{{ askSuggestionAnswered }}\" style=\"padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;text-align:left;\">How many enterprise contracts do we hold in EMEA that are audit-standard?<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ askSuggestionEvidence }}\" style=\"padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;text-align:left;\">Are our suppliers fully certified for the new audit cycle?<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ askSuggestionEntitlement }}\" style=\"padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;text-align:left;\">What was the total payroll spend by region last quarter?<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-for list=\"{{ akkiMessagesView }}\" as=\"m\" hint-placeholder-count=\"2\">\n                  <sc-if value=\"{{ m.isUser }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"align-self:flex-end;max-width:80%;\">\n                      <sc-if value=\"{{ m.isEditing }}\" hint-placeholder-val=\"{{ false }}\">\n                        <textarea value=\"{{ m.editDraft }}\" sc-camel-on-change=\"{{ m.onEditDraftChange }}\" style=\"width:100%;min-height:48px;padding:8px 10px;border:1px solid var(--blue);border-radius:8px;font-size:13.5px;\"><\u002Ftextarea>\n                        <div style=\"display:flex;gap:8px;margin-top:6px;justify-content:flex-end;\">\n                          <button sc-camel-on-click=\"{{ m.onCancelEdit }}\" style=\"font-size:11.5px;pa                                  <div style=\"font-family:var(--head);font-size:20px;color:var(--sage);\">{{ m.audit.dilution }}%<\u002Fdiv>\n                                    <div style=\"font-size:10.5px;color:var(--ink3);max-width:135px;line-height:1.4;\">Dilution — how much of the original detail the model actually saw<\u002Fdiv>\n                                  <\u002Fdiv>\n                                <\u002Fdiv>\n                                <div style=\"font-family:var(--mono);font-size:11px;color:var(--ink2);display:flex;flex-direction:column;gap:3px;margin-bottom:10px;\">\n                                  <div>Purpose: {{ m.audit.purpose }}<\u002Fdiv>\n                                  <div>Audit ID: {{ m.audit.auditId }}<\u002Fdiv>\n                                  <div>Trust receipt ID: {{ m.audit.receiptId }}<\u002Fdiv>\n                                <\u002Fdiv>\n                                <div style=\"font-size:12px;color:var(--ink3);font-style:italic;\">{{ m.audit.closing }}<\u002Fdiv>\n                                <\u002Fsc-if>\n                              <\u002Fdiv>\n                            <\u002Fsc-if>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n\n                      <sc-if value=\"{{ m.isRefusedEvidence }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"background:var(--oxblood2);padding:22px 24px;border-radius:0 8px 8px 0;border-left:2px solid var(--oxblood);color:var(--paper);\">\n                          <div style=\"font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#fbebef;font-weight:700;margin-bottom:10px;\">Refused — evidence floor<\u002Fdiv>\n                          <div style=\"font-family:var(--head);font-size:19px;margin-bottom:10px;\">{{ m.refusalHeadline }}<\u002Fdiv>\n                          <div style=\"font-size:14px;line-height:1.6;margin-bottom:18px;color:#fbebef;\">{{ m.refusalBody }}<\u002Fdiv>\n                          <div style=\"display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;\">\n                            <button sc-camel-on-click=\"{{ m.onAcceptRecorded }}\" style=\"padding:9px 14px;background:var(--paper);color:var(--oxblood);border:none;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;\">Accept as recorded statement<\u002Fbutton>\n                            <button sc-camel-on-click=\"{{ m.onNarrow }}\" style=\"padding:9px 14px;background:transparent;color:var(--paper);border:1px solid rgba(245,242,234,.5);border-radius:6px;font-size:12.5px;cursor:pointer;white-space:nowrap;\">Narrow the objective<\u002Fbutton>\n                            <button sc-camel-on-click=\"{{ m.onLower }}\" style=\"padding:9px 14px;background:transparent;color:var(--paper);border:1px solid rgba(245,242,234,.5);border-radius:6px;font-size:12.5px;cursor:pointer;white-space:nowrap;\">Lower the standard<\u002Fbutton>\n                          <\u002Fdiv>\n                          <div style=\"font-size:11.5px;color:#fbebef;font-style:italic;\">A refusal is the system keeping its promise.<\u002Fdiv>\n                          <sc-if value=\"{{ m.actionNote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:10px;font-size:12px;color:#fff;background:rgba(255,255,255,.14);padding:8px 12px;border-radius:6px;\">{{ m.actionNote }}<\u002Fdiv><\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n\n                      <sc-if value=\"{{ m.isRefusedEntitlement }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"background:var(--oxblood2);padding:22px 24px;border-radius:0 8px 8px 0;border-left:2px solid var(--oxblood);color:var(--paper);\">\n                          <div style=\"font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#fbebef;font-weight:700;margin-bottom:10px;\" amel-on-click=\"{{ mo.onClick }}\" style=\"padding:7px 14px;cursor:pointer;background:{{ mo.bg }};\">\n                                <div style=\"font-size:12px;color:var(--ink);\">{{ mo.name }}<\u002Fdiv>\n                                <div style=\"font-size:10.5px;color:var(--ink3);\">{{ mo.desc }}<\u002Fdiv>\n                              <\u002Fdiv>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;\">\n                      <div sc-camel-on-click=\"{{ akkiSetAutoShield }}\" style=\"font-size:11px;padding:6px 9px;cursor:pointer;background:{{ akkiAutoShieldBg }};color:{{ akkiAutoShieldColor }};white-space:nowrap;\">Auto-shield<\u002Fdiv>\n                      <div sc-camel-on-click=\"{{ akkiSetAlwaysShield }}\" style=\"font-size:11px;padding:6px 9px;cursor:pointer;background:{{ akkiAlwaysShieldBg }};color:{{ akkiAlwaysShieldColor }};white-space:nowrap;\">Always-shield<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div sc-camel-on-click=\"{{ akkiToggleThinkHarder }}\" style=\"font-size:11px;padding:6px 9px;border:1px solid {{ akkiThinkHarderBorder }};border-radius:6px;cursor:pointer;color:{{ akkiThinkHarderColor }};white-space:nowrap;\">Think harder<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:12px;\">\n                    <button sc-camel-on-click=\"{{ openDocWizChat }}\" style=\"font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;white-space:nowrap;\">+ Create document from this chat<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ akkiSend }}\" style=\"padding:8px 18px;background:var(--blue);color:var(--paper);border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer; :16px;\">\n                  <h3 style=\"font-family:var(--head);font-weight:400;font-size:19px;margin:0;\">Archived conversations<\u002Fh3>\n                  <span sc-camel-on-click=\"{{ akkiCloseArchive }}\" style=\"cursor:pointer;color:var(--ink3);font-size:18px;\">×<\u002Fspan>\n                <\u002Fdiv>\n                <input value=\"{{ akkiArchiveQuery }}\" sc-camel-on-change=\"{{ akkiArchiveQueryChange }}\" placeholder=\"Search archive...\" style=\"padding:9px 12px;border:1px solid var(--line);border-radius:7px;font-size:13px;margin-bottom:10px;\">\n                <div style=\"display:flex;gap:6px;margin-bottom:14px;\">\n                  <sc-for list=\"{{ akkiArchiveSortOptions }}\" as=\"so\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ so.onClick }}\" style=\"padding:5px 11px;border-radius:14px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid {{ so.border }};background:{{ so.bg }};color:{{ so.color }};\">{{ so.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;\">\n                  <sc-for list=\"{{ akkiArchivedView }}\" as=\"a\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;\">\n                      <div style=\"min-width:0;\">\n                        <div style=\"font-size:13px;color:var(--ink);\">{{ a.title }}<\u002Fdiv>\n                        <div style=\"font-size:11px;color:var(--ink3);\">Archived {{ a.archivedAt }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;gap:7px;flex-shrink:0;\">\n                        <button sc-camel-on-click=\"{{ a.onRestore }}\" style=\"padding:7px 11px;border:1px solid var(--line);background:none;border-radius:6px;font-size:11.5px; low:hidden;\">\n                    <div style=\"height:100%;background:var(--blue);width:{{ deepDiveLoadingPct }}%;transition:width .5s ease;\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ deepDiveShowForm }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"max-width:520px;\">\n                  <div style=\"font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px;\">What are you trying to learn from these files? <span style=\"color:var(--oxblood2);\">*<\u002Fspan><\u002Fdiv>\n                  <textarea value=\"{{ analyzeDeepDiveObjective }}\" sc-camel-on-change=\"{{ onAnalyzeDeepDiveObjectiveChange }}\" placeholder=\"e.g. Understand what's driving the change in vendor concentration risk\" style=\"width:100%;min-height:80px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-size:13px;margin-bottom:14px;\"><\u002Ftextarea>\n                  <sc-if value=\"{{ deepDiveObjectiveFilled }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;align-items:center;gap:12px;\">\n                      <button sc-camel-on-click=\"{{ runAnalyzeDeepDiveSynthesis }}\" style=\"padding:10px 18px;border:none;border-radius:7px;background:var(--blue);color:#fff;font-size:13px;font-weight:600;cursor:pointer;\">Run Deep Dive<\u002Fbutton>\n                      <span style=\"font-family:var(--mono);font-size:11px;color:var(--ink3);\">Est. cost: ~420 credits<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ deepDiveShowResults }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"max-width:600px;display:flex;flex-direction:column;gap:18px;\">\n                  <div>\n                    <div style=\"font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase;margin-bottom:6px;\">Objective<\u002Fdiv>\n                    <div style=\"font-size:13.5px;color:var(--ink2);\">{{ analyzeDeepDiveObjective }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background:var(--surface);border-left:2px solid var(--sage);padding:16px 18px;border-radius:0 8px 8px 0;\">\n                    <div style=\"font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--sage);text-transform:uppercase;margin-bottom:8px;\">Synthesis<\u002Fdiv>\n                    <div style=\"font-size:14px;line-height:1.6;color:var(--ink);\">{{ analyzeDeepDiveSynthesis }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ deepDiveFollowupAnswered }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:13px;color:var(--ink2);background:var(--surface2);padding:12px 16px;border-radius:6px;\">{{ analyzeDeepDiveFollowupAnswer }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div>\n                    <div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;margin-bottom:10px;\">Extracted signals<\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:22px;\">\n                      <sc-for list=\"{{ analyzeSignals }}\" as=\"sg\" hint-placeholder-count=\"5\">\n                        <div style=\"border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff;\">\n                          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;\">\n                            <span style=\"font-size:10px;font-weight:700;padding:2px 8px;border-radius:9px;background:{{ sg.bg }};color:{{ sg.color }};\">{{ sg.type }}<\u002Fspan>\n                            <span style=\"font-family:var(--mono);font-size:11px;color:var(--ink3);\">{{ sg.confidence }}% confidence<\u002Fspan>\n                          <\u002Fdiv>\n                          <div style=\"font-size:12.5px;color:var(--ink2);line-height:1.55;\">“{{ sg.quote }}”<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12px;color:var(--ink3);margin-bottom:8px;\">Ask a follow-up, or revise the objective above.<\u002Fdiv>\n                    <div style=\"display:flex;gap:8px;margin-bottom:12px;\">\n                      <input value=\"{{ analyzeDeepDiveFollowup }}\" sc-camel-on-change=\"{{ onAnalyzeDeepDiveFollowupChange }}\" placeholder=\"Ask a follow-up...\" style=\"flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;\">\n                      <button sc-camel-on-click=\"{{ submitAnalyzeDeepDiveFollowup }}\" style=\"padding:9px 16px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;\">Ask<\u002Fbutton>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;gap:9px;\">\n                      <button sc-camel-on-click=\"{{ saveAnalyzeDeepDive }}\" style=\"padding:9px 15px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:12.5px;cursor:pointer;\">Save<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ runAnotherAnalyzeDeepDive }}\" style=\"padding:9px 15px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:12.5px;cursor:pointer;\">Run another deep dive<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isAnalyzeSources }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:22px;\">\n                <sc-for list=\"{{ analyzeSourceFilesView }}\" as=\"f\" hint-placeholde }\">\n              <div style=\"display:flex;gap:32px;align-items:flex-start;\">\n               <div style=\"flex:1;min-width:0;max-width:660px;\">\n                <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;\">\n                  <span sc-camel-on-click=\"{{ tlExitSession }}\" style=\"font-size:12.5px;color:var(--ink3);cursor:pointer;\">← ThinkLab<\u002Fspan>\n                  <span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink3);\">{{ tlModeNum }}<\u002Fspan>\n                  <span style=\"font-family:var(--head);font-size:18px;\">{{ tlModeTitle }}<\u002Fspan>\n                  <span style=\"font-family:var(--mono);font-size:10.5px;color:var(--ink3);\">{{ tlModeDuration }}<\u002Fspan>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px;\">\n                  <sc-for list=\"{{ tlStripLive }}\" as=\"st\" hint-placeholder-count=\"5\">\n                    <div style=\"display:flex;align-items:center;gap:7px;\">\n                      <span style=\"width:7px;height:7px;border-radius:50%;background:{{ st.dot }};flex-shrink:0;animation:{{ st.anim }};\"><\u002Fspan>\n                      <span style=\"font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:{{ st.color }};font-weight:{{ st.weight }};\">{{ st.label }}<\u002Fspan>\n                      <sc-if value=\"{{ st.hasArrow }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:var(--line);font-size:11px;\">→<\u002Fspan><\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ tlIsFrame }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"margin-bottom:22px;\">\n                    <div style=\"font-size:10px;letter-spacing:.08em;color:var(--ink3);margin-bottom:9px;\">MATERIAL — OPTIONAL<\u002Fdiv>\n                    <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;\">\n                      <label style=\"font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:7px;padding:8px 13px;cursor:pointer;background:#fff;\">Upload<input type=\"file\" sc-camel-on-change=\"{{ tlAttachFile }}\" style=\"display:none;\"><\u002Flabel>\n                      <button sc-camel-on-click=\"{{ tlTogglePaste }}\" style=\"font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:7px;padding:8px 13px;cursor:pointer;background:#fff;\">Paste<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ tlAttachFromContext }}\" style=\"font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:7px;padding:8px 13px;cursor:pointer;background:#fff;\">Attach from context<\u002Fbutton>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ tlPasteOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-bottom:10px;\">\n                        <textarea value=\"{{ tlPasteText }}\" sc-camel-on-change=\"{{ tlPasteChange }}\" placeholder=\"Paste text here…\" style=\"width:100%;min-height:70px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;margin-bottom:8px;\"><\u002Ftextarea>\n                        <button sc-camel-on-click=\"{{ tlCommitPaste }}\" style=\"padding:7px 13px;border:none;background:var(--accent);color:#fff;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;\">Add<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ tlMaterialEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"font-size:11.5px;color:var(--ink3);\">Nothing brought. The session runs on the conversation alone.<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                      <sc-for list=\"{{ tlMaterialView }}\" as=\"mt\" hint-placeholder-count=\"0\">\n                        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:7px;font-size:12px;\">\n                          <span style=\"min-width:0;\">{{ mt.name }}<\u002Fspan>\n                          <span style=\"display:flex;align-items:center;gap:9px;flex-shrink:0;\">\n                            <span style=\"font-family:var(--mono);font-size:10px;color:var(--ink3);\">{{ mt.route }}<\u002Fspan>\n                            <span sc-camel-on-click=\"{{ mt.onRemove }}\" style=\"cursor:pointer;color:var(--ink3);font-size:14px;\">×<\u002Fspan>\n                          <\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:16px;\">\n                  <sc-for list=\"{{ tlMessagesView }}\" as=\"m\" hint-placeholder-count=\"2\">\n                    <div style=\"align-self:{{ m.align }};max-width:90%;\">\n                      <div style=\"font-size:10px;color:var(--ink3);margin-bottom:3px;\">{{ m.label }}<\u002Fdiv>\n                      <div style=\"padding:11px 15px;border-radius:9px;font-size:13.5px;line-height:1.55;background:{{ m.bg }};color:var(--ink);\">{{ m.text }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ tlProbesOpen }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex;gap:9px;margin-bottom:20px;\">\n                    <input value=\"{{ tlInput }}\" sc-camel-on-change=\"{{ tlInputChange }}\" sc-camel-on-key-down=\"{{ tlKeyDown }}\" placeholder=\"Answer in your own words…\" style=\"flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;\">\n                    <button sc-camel-on-click=\"{{ tlSubmit }}\" style=\"padding:11px 18px;border:none;background:var(--accent);color:#fff;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;\">Send<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ tlProbesDone }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"border-top:1px solid var(--line);padding-top:18px;\">\n\n                    <sc-if value=\"{{ tlHasEngineEntries }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"margin-bottom:20px;\">\n                        <div style=\"font-size:10px;letter-spacing:.08em;color:var(--ink3);margin-bottom:10px;\">{{ tlStageLabel }} — ENGINE OUTPUT<\u002Fdiv>\n                        <div style=\"display:flex;flex-direction:column;gap:7px;\">\n                          <sc-for list=\"{{ tlEngineEntries }}\" as=\"en\" hint-placeholder-count=\"2\">\n                            <div style=\"font-size:13px;color:var(--ink2);line-height:1.55;padding:10px 13px;background:var(--surface);border-left:2px solid var(--accent);border-radius:0 7px 7px 0;\">{{ en.text }}<\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <sc-if value=\"{{ tlIsScenarios }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-bottom:20px;\">\n                        <div style=\"font-size:10px;letter-spacing:.08em;color:var(--ink3);margin-bottom:10px;\">SCENARIO EXPANSION — SECOND-ORDER EFFECTS<\u002Fdiv>\n                        <div style=\"display:flex;flex-direction:column;gap:9px;\">\n                          <sc-for list=\"{{ tlScenarios }}\" as=\"sc\" hint-placeholder-count=\"3\">\n                            <div style=\"border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff;\">\n                              <div style=\"font-size:13px;font-weight:600;color:var(--ink);margin-bottom:5px;\">{{ sc.name }}<\u002Fdiv>\n                              <div style=\"font-size:12.5px;color:var(--ink2);line-height:1.55;\">{{ sc.second }}<\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <sc-if value=\"{{ tlIsWeigh }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-bottom:20px;\">\n                        <div style=\"font-size:10px;letter-spacing:.08em;color:var(--ink3);margin-bottom:10px;\">WEIGHTED PICTURE — CONFIDENCE PER CLUSTER<\u002Fdiv>\n                        <div style=\"display:flex;flex-direction:column;gap:7px;\">\n                          <sc-for list=\"{{ tlWeighClusters }}\" as=\"wc\" hint-placeholder-count=\"3\">\n                            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 13px;border:1px solid var(--line);border-radius:7px;background:#fff;\">\n                              <span style=\"font-size:12.5px;color:var(--ink);min-width:0;\">{{ wc.cluster }}<\u002Fspan>\n                              <span style=\"font-size:11px;font-weight:700;color:{{ wc.color }};flex-shrink:0;white-space:nowrap;\">{{ wc.confidence }}<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <sc-if value=\"{{ tlIsLockin }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div>\n                        <div style=\"font-size:10px;letter-spacing:.08em;color:var(--ink3);margin-bottom:9px;\">THE CONCLUSION<\u002Fdiv>\n                        <div style=\"font-size:14.5px;color:var(--ink);line-height:1.65;margin-bottom:22px;\">{{ tlConclusion }}<\u002Fdiv>\n\n                        <div style=\"border:1px solid var(--accent);background:var(--accent-soft);border-radius:9px;padding:15px 17px;margin-bottom:20px;\">\n                          <div style=\"font-size:10px;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-bottom:5px;\">THE LOAD-BEARING SET<\u002Fdiv>\n                          <div style=\"font-size:11.5px;color:var(--ink3);margin-bottom:11px;\">What this position actually rests on. These units cross the boundary; the confidence does not.<\u002Fdiv>\n                          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                            <sc-for list=\"{{ tlLoadBearing }}\" as=\"lb\" hint-placeholder-count=\"3\">\n                              <div style=\"display:flex;gap:9px;font-size:12.5px;color:var(--ink2);line-height:1.5;\"><span style=\"color:var(--accent);\">·<\u002Fspan><span>{{ lb.text }}<\u002Fspan><\u002Fdiv>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n\n                        <div style=\"margin-bottom:22px;\">\n                          <div style=\"font-size:10px;letter-spacing:.08em;color:var(--ink3);margin-bottom:9px;\">THE REFLECTION<\u002Fdiv>\n                          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n                            <sc-for list=\"{{ tlReflection }}\" as=\"rf\" hint-placeholder-count=\"2\">\n                              <div style=\"font-size:12.5px;color:var(--ink2);line-height:1.6;border-left:2px solid var(--brass);padding-left:11px;\">{{ rf.text }}<\u002Fdiv>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n\n                        <sc-if value=\"{{ !tlLocked }}\" hint-placeholder-val=\"{{ true }}\">\n                          <button sc-camel-on-click=\"{{ tlLockIn }}\" style=\"padding:11px 19px;border:none;background:var(--accent);color:#fff;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;\">Lock in this position<\u002Fbutton>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ tlLocked }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div>\n                            <div style=\"font-size:12px;color:var(--sage);font-weight:600;margin-bottom:14px;\">✓ Locked in — the session record is written.<\u002Fdiv>\n                            <div style=\"display:flex;gap:9px;flex-wrap:wrap;\">\n                              <button sc-camel-on-click=\"{{ tlExportBrief }}\" style=\"padding:10px 16px;border:none;background:var(--blue);color:#fff;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;\">Export the Brief<\u002Fbutton>\n                              <sc-if value=\"{{ !tlHandedOff }}\" hint-placeholder-val=\"{{ true }}\">\n                                <button sc-camel-on-click=\"{{ tlHandoffToTasks }}\" style=\"padding:10px 16px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;\">Hand off to Task Manager<\u002Fbutton>\n                              <\u002Fsc-if>\n                              <sc-if value=\"{{ tlHandedOff }}\" hint-placeholder-val=\"{{ false }}\">\n                                <span style=\"font-size:12px;color:var(--sage);font-weight:600;align-self:center;\">✓ Tracked in Task Manager<\u002Fspan>\n                              <\u002Fsc-if>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);\">\n                      <span style=\"font-size:11px;font-style:italic;color:var(--ink3);max-width:340px;line-height:1.45;\">{{ tlGateNote }}<\u002Fspan>\n                      <div style=\"display:flex;gap:8px;\">\n                        <sc-if value=\"{{ tlHasBack }}\" hint-placeholder-val=\"{{ false }}\">\n                          <button sc-camel-on-click=\"{{ tlBackStage }}\" style=\"padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:12px;cursor:pointer;\">← Back<\u002Fbutton>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ !tlIsLockin }}\" hint-placeholder-val=\"{{ true }}\">\n                          <button sc-camel-on-click=\"{{ tlAdvanceStage }}\" style=\"padding:8px 15px;border:none;background:var(--accent);color:#fff;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Continue →<\u002Fbutton>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n               <\u002Fdiv>\n\n               <div style=\"width:290px;flex-shrink:0;\">\n                <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;\">\n                  <div style=\"font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);\">This Session<\u002Fdiv>\n                  <span sc-camel-on-click=\"{{ openShieldReport }}\" title=\"Shield report\" style=\"font-size:10.5px;color:var(--sage);border:1px solid var(--sage);border-radius:6px;padding:3px 8px;cursor:pointer;\">Shield<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:2px;background:var(--accent);width:26px;margin-bottom:8px;\"><\u002Fdiv>\n                <div style=\"font-size:11px;font-style:italic;color:var(--ink3);margin-bottom:11px;\">{{ tlModeDuration }} · a structured pause with a known cost<\u002Fdiv>\n                <div style=\"font-size:12

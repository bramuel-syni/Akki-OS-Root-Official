1.45;\">{{ st.v }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"padding:16px 20px;display:flex;gap:14px;align-items:flex-start;\">\n                <span style=\"width:6px;height:6px;border-radius:50%;background:var(--oxblood);flex-shrink:0;margin-top:6px;\"><\u002Fspan>\n                <div style=\"font-size:12.5px;color:var(--ink2);line-height:1.6;min-width:0;text-wrap:pretty;\">{{ estCustody }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;\">\n              <div style=\"padding:13px 20px;border-bottom:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b8371;\">What you can do with it<\u002Fdiv>\n              <sc-for list=\"{{ estOps }}\" as=\"op\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:12px 20px;border-bottom:1px solid var(--line);\">\n                  <div style=\"flex:0 0 152px;min-width:120px;font-size:12.5px;font-weight:600;color:var(--ink);\">{{ op.name }}<\u002Fdiv>\n                  <div style=\"flex:1 1 150px;min-width:0;font-size:12px;color:var(--ink3);line-height:1.45;\">{{ op.leaves }}<\u002Fdiv>\n                  <span style=\"flex-shrink:0;font-size:10.5px;font-weight:600;color:{{ op.color }};background:{{ op.bg }};border-radius:20px;padding:4px 10px;white-space:nowrap;\">{{ op.state }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:14px 20px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;\">\n                <button sc-camel-on-click=\"{{ estGoProcessed }}\" style=\"padding:9px 15px;border:none;background:var(--blue);color:#fff;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;\">Get intelligence from it<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ estGoFinetune }}\" style=\"padding:9px 15px;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;\">Train a model on it<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ estGoSkills }}\" style=\"padding:9px 15px;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;\">Build a skill on it<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ estGoRaw }}\" style=\"padding:9px 15px;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;\">Download the raw data<\u002Fbutton>\n                <span style=\"font-size:11.5px;color:var(--ink3);\">This data set will be pre-selected in your request.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isExtract }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fadeIn .25s ease;\">\n            <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;\">\n              <div sc-camel-on-click=\"{{ howToggle }}\" style=\"padding:13px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;\">\n                <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b8371;\">How it works<\u002Fspan>\n                <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#8b8371\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;transform:{{ howChev }};\"><path d=\"M4 6l4 4 4-4\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <sc-if value=\"{{ howOpen }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;padding:18px 20px 16px;border-bottom:1px solid var(--line);\">\n                <sc-for list=\"{{ profileRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                  <div style=\"flex:1 1 0;min-width:0;padding-right:16px;\">\n                    <div style=\"display:flex;align-items:center;gap:0;margin-bottom:9px;\">\n                      <span style=\"width:9px;height:9px;border-radius:50%;background:var(--accent);border:1px solid var(--accent);flex-shrink:0;display:block;\"><\u002Fspan>\n                      <sc-if value=\"{{ r.notLast }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span style=\"flex:1;height:1px;background:var(--accent);min-width:0;display:block;\"><\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin-bottom:6px;\">{{ r.l }}<\u002Fdiv>\n                    <div style=\"font-size:12px;color:var(--ink2);line-height:1.5;text-wrap:pretty;\">{{ r.v }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"padding:15px 20px;background:{{ practiceBg }};font-size:12.5px;color:var(--ink2);line-height:1.65;text-wrap:pretty;\">{{ practice }}<\u002Fdiv>\n              <sc-if value=\"{{ isFinetune }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:18px 20px;border-top:1px solid var(--line);\">\n                  <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;\">\n                    <div style=\"flex:1;min-width:150px;border:1px dashed var(--line);border-radius:9px;padding:12px 13px;background:var(--surface);\">\n                      <div style=\"font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:3px;\">Your model<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:var(--ink3);line-height:1.45;\">Comes to Digicow, fingerprinted on arrival<\u002Fdiv>\n                    <\u002Fdiv>\n                    <svg width=\"26\" height=\"14\" sc-camel-view-box=\"0 0 26 14\" fill=\"none\" stroke=\"var(--ink3)\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;\"><path d=\"M1 7h22\"><\u002Fpath><path d=\"m18 3 4.5 4-4.5 4\"><\u002Fpath><\u002Fsvg>\n                    <div style=\"flex:1.3;min-width:180px;border:1px solid var(--sage);border-radius:9px;padding:12px 13px;background:rgba(29,122,110,.07);\">\n                      <div style=\"font-size:12.5px;font-weight:600;color:var(--sage);margin-bottom:3px;\">Digicow computers<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:var(--ink2);line-height:1.45;\">Training happens here, next to the data. Nothing is copied out.<\u002Fdiv>\n                    <\u002Fdiv>\n                    <svg width=\"26\" height=\"14\" sc-camel-view-box=\"0 0 26 14\" fill=\"none\" stroke=\"var(--ink3)\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;\"><path d=\"M1 7h22\"><\u002Fpath><path d=\"m18 3 4.5 4-4.5 4\"><\u002Fpath><\u002Fsvg>\n                    <div style=\"flex:1;min-width:150px;border:1px solid var(--gate);border-radius:9px;padding:12px 13px;background:rgba(124,58,175,.06);\">\n                      <div style=\"font-size:12.5px;font-weight:600;color:var(--gate);margin-bottom:3px;\">Trained model out<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:var(--ink3);line-height:1.45;\">Released to you with its usage rights attached<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:14px;font-size:12px;color:var(--ink3);line-height:1.6;\">It only works this way round. Nothing in this portal can send Digicow data to computers you control, and any attempt to ask for that is declined and noted.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;\">\n              <div style=\"padding:16px 20px;border-bottom:1px solid var(--line);\">\n                <div style=\"display:flex;align-items:center;gap:8px;\">\n                  <span style=\"width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;\"><\u002Fspan>\n                  <div style=\"font-size:13px;font-weight:600;color:var(--ink);\">Assistance<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--ink3);margin-top:5px;line-height:1.5;\">Helps you shape a request before you submit it. It cannot approve anything, and it cannot change a request once submitted.<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hasChatLog }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:16px 20px;display:flex;flex-direction:column;gap:12px;\">\n                  <sc-for list=\"{{ chatLog }}\" as=\"m\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;flex-direction:column;align-items:{{ m.align }};\">\n                      <div style=\"max-width:80%;border:1px solid {{ m.border }};background:{{ m.bg }};border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--ink2);line-height:1.6;text-wrap:pretty;overflow-wrap:anywhere;\">{{ m.text }}<\u002Fdiv>\n                      <sc-if value=\"{{ m.hasTag }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:{{ m.tagColor }};margin-top:5px;\">{{ m.tag }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ jobShaping }}\" hint-placeholder-val=\"{{ true }}\">\n              <sc-if value=\"{{ hasComposeNote }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:flex-start;gap:12px;justify-content:space-between;background:rgba(76,95,213,.07);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:14px;\">\n                  <div style=\"flex:1;min-width:0;\">\n                    <div style=\"font-size:12.5px;color:var(--ink2);line-height:1.55;text-wrap:pretty;\">{{ composeNote.line }}<\u002Fdiv>\n                    <span sc-camel-on-click=\"{{ composeNote.onView }}\" style=\"display:inline-block;margin-top:6px;font-size:11.5px;font-weight:600;color:var(--blue);cursor:pointer;\">View request \\u2192<\u002Fspan>\n                    <sc-if value=\"{{ composeNote.hasAssistant }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:11px;color:var(--ink3);margin-top:6px;\">Your notes with the assistant are saved with the request.<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <span sc-camel-on-click=\"{{ composeNote.onDismiss }}\" style=\"font-size:16px;line-height:1;color:var(--ink3);cursor:pointer;flex-shrink:0;padding:2px;\">\\u00d7<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;opacity:{{ composeCardOpacity }};pointer-events:{{ composeCardPointer }};transition:opacity .15s ease;\">\n                <div sc-camel-on-click=\"{{ setupToggle }}\" style=\"padding:13px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;\">\n                  <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b8371;\">Set up your request<\u002Fspan>\n                  <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#8b8371\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;transform:{{ setupChev }};\"><path d=\"M4 6l4 4 4-4\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <sc-if value=\"{{ setupOpen }}\" hint-placeholder-val=\"{{ true }}\">\n                <sc-if value=\"{{ hasCopyBanner }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:13px 20px;border-bottom:1px solid var(--line);background:rgba(76,95,213,.06);\">\n                    <div style=\"font-size:12.5px;color:var(--ink2);line-height:1.6;text-wrap:pretty;\">Started from {{ copyBannerId }} ({{ copyBannerStatus }}). This is a new request — edit anything before you submit. Data isn't carried over; pick it again below.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"padding:18px 20px;border-bottom:1px solid var(--line);\">\n                  <div style=\"font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px;\">What you need<\u002Fdiv>\n                  <textarea ref=\"{{ objRef }}\" value=\"{{ objDraft }}\" sc-camel-on-change=\"{{ objChange }}\" placeholder=\"{{ objPlaceholder }}\" disabled=\"{{ composeSubmitBusy }}\" style=\"width:100%;min-height:70px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.55;color:var(--ink);background:#fff;resize:vertical;\"><\u002Ftextarea>\n                  <div style=\"font-size:11.5px;color:var(--ink3);margin-top:7px;line-height:1.5;\">{{ objHint }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:18px 20px;border-bottom:1px solid var(--line);\">\n                  <div style=\"font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:9px;\">Which data<\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:7px;\">\n                    <sc-for list=\"{{ scopeChips }}\" as=\"c\" hint-placeholder-count=\"5\">\n                      <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"border:1px solid {{ c.border }};background:{{ c.bg }};border-radius:8px;padding:8px 11px;cursor:{{ c.cursor }};min-width:0;opacity:{{ c.opacity }};\">\n                        <div style=\"font-size:12px;font-weight:600;color:{{ c.color }};margin-bottom:2px;\">{{ c.label }}<\u002Fdiv>\n                        <div style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink3);\">{{ c.meta }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ modeFields }}\" as=\"f\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;gap:16px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;\">\n                    <div style=\"flex:0 0 132px;min-width:100px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);\">{{ f.l }}<\u002Fdiv>\n                    <div style=\"flex:1;min-width:180px;font-size:12.5px;color:var(--ink);line-height:1.5;\">{{ f.v }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display:flex;gap:16px;padding:13px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;\">\n                  <div style=\"flex:0 0 132px;min-width:100px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding-top:2px;\">Agreement<\u002Fdiv>\n                  <div style=\"flex:1;min-width:180px;\">\n                    <div style=\"font-size:12.5px;color:var(--ink);margin-bottom:3px;\">{{ termsId }} · counted by {{ meterUnit }}<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:var(--ink3);line-height:1.5;\">No price yet — Digicow has not set its rates. Your usage is still counted so it can be billed correctly once they are.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:16px;padding:13px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;\">\n                  <div style=\"flex:0 0 132px;min-width:100px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding-top:2px;\">Sign-off<\u002Fdiv>\n                  <div style=\"flex:1;min-width:180px;\">\n                    <div style=\"display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:{{ apprColor }};margin-bottom:4px;\">\n                      <span style=\"width:6px;height:6px;border-radius:50%;background:{{ apprColor }};\"><\u002Fspan>{{ apprHead }}\n                    <\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:var(--ink3);line-height:1.55;text-wrap:pretty;\">{{ apprWhy }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ hasSubmitError }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:0 20px 12px;font-size:11.5px;color:var(--oxblood);line-height:1.5;\">{{ submitErrorMsg }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;\">\n                  <button sc-camel-on-click=\"{{ freeze }}\" disabled=\"{{ composeSubmitBusy }}\" style=\"padding:10px 17px;border:none;background:var(--blue);color:#fff;border-radius:7px;font-size:13px;font-weight:600;opacity:{{ submitBtnOpacity }};cursor:{{ submitBtnCursor }};\">{{ submitBtnLabel }}<\u002Fbutton>\n                  <div style=\"flex:1;min-width:200px;font-size:11.5px;color:var(--ink3);line-height:1.5;\">Once submitted, your request is fixed. If you need more later, that is a new request — nobody, including the assistant, can widen this one.<\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isKey }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fadeIn .25s ease;\">\n            <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;\">\n              <div style=\"padding:13px 20px;border-bottom:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b8371;\">How a connected workspace works<\u002Fdiv>\n              <sc-for list=\"{{ profileRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:8px 16px;padding:11px 20px;border-bottom:1px solid var(--line);\">\n                  <div style=\"flex:0 0 132px;min-width:100px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding-top:2px;\">{{ r.l }}<\u002Fdiv>\n                  <div style=\"flex:1 1 176px;min-width:0;font-size:12.5px;color:var(--ink);line-height:1.5;\">{{ r.v }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:15px 20px;background:rgba(29,122,110,.07);font-size:12.5px;color:var(--ink2);line-height:1.65;text-wrap:pretty;\">Your queries run on Digicow systems. The question comes in, results go back with identifying details removed, and the data itself never travels to your workspace — there is no setting that allows it.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;\">\n              <div style=\"padding:13px 20px;border-bottom:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b8371;\">API key<\u002Fdiv>\n              <div style=\"display:flex;gap:16px;padding:13px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;\">\n                <div style=\"flex:0 0 132px;min-width:100px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding-top:2px;\">Issued to<\u002Fdiv>\n                <div style=\"flex:1;min-width:180px;\">\n                  <div style=\"font-size:12.5px;color:var(--ink);margin-bottom:3px;\">{{ principal }}<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:var(--ink3);line-height:1.5;\">Keys are issued to a named person, not to your organisation. Each one can do what that person is allowed to do, and cannot be passed on.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:16px;padding:13px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;\">\n                <div style=\"flex:0 0 132px;min-width:100px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding-top:2px;\">What it can do<\u002Fdiv>\n                <div style=\"flex:1;min-width:180px;font-size:12.5px;color:var(--ink);line-height:1.5;\">See summaries; query the documents and logs; submit requests within your agreement.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:16px;padding:13px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;\">\n                <div style=\"flex:0 0 132px;min-width:100px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding-top:2px;\">How long it lasts<\u002Fdiv>\n                <div style=\"flex:1;min-width:180px;\">\n                  <div style=\"font-size:12.5px;color:var(--ink);margin-bottom:3px;\">This session only<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:var(--brass);line-height:1.5;\">Digicow has not yet decided how long keys should last, so for now each one expires when you log out.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ keyIdle }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;\">\n                  <button sc-camel-on-click=\"{{ issueKey }}\" style=\"padding:10px 17px;border:none;background:var(--blue);color:#fff;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;\">Issue a key<\u002Fbutton>\n                  <span style=\"font-size:11.5px;color:var(--ink3);\">Shown once. Digicow does not store the key anywhere.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ keyLive }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:16px 20px;\">\n                  <div style=\"border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:13px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;\">\n                    <div style=\"font-family:var(--mono);font-size:12.5px;color:var(--ink);min-width:0;overflow-wrap:anywhere;flex:1;\">{{ keyValue }}<\u002Fdiv>\n                    <span style=\"font-size:10.5px;font-weight:600;color:{{ keyStateColor }};background:{{ keyStateBg }};border-radius:20px;padding:4px 10px;flex-shrink:0;\">{{ keyState }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:var(--ink3);line-height:1.55;margin-top:10px;\">{{ keyNote }}<\u002Fdiv>\n                  <sc-if value=\"{{ keyActive }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button sc-camel-on-click=\"{{ revokeKey }}\" style=\"margin-top:13px;padding:8px 14px;border:1px solid var(--oxblood);background:#fff;color:var(--oxblood);border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Revoke now<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isAgents }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fadeIn .25s ease;\">\n            <div style=\"border:1px solid var(--oxblood);border-radius:14px;background:rgba(184,57,91,.05);padding:17px 20px;margin-bottom:16px;\">\n              <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--oxblood);margin-bottom:8px;\">Before you connect an agent<\u002Fdiv>\n              <div style=\"font-size:13px;color:var(--ink2);line-height:1.7;text-wrap:pretty;\">Your agent will be treated as a user in its own right, not as part of your login. It gets its own account and its own permissions, Digicow approves it separately, and automated monitoring applies from its first request. Digicow looks at everything it takes over time — not just one request at a time.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ agentForm }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;\">\n                <div style=\"padding:13px 20px;border-bottom:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b8371;\">Register your agent<\u002Fdiv>\n                <div style=\"padding:16px 20px;border-bottom:1px solid var(--line);\">\n                  <div style=\"font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px;\">Agent name<\u002Fdiv>\n                  <input value=\"{{ agentName }}\" sc-camel-on-change=\"{{ agentNameChange }}\" placeholder=\"e.g. meridian-corpus-agent-1\" style=\"width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--ink);background:#fff;\">\n                <\u002Fdiv>\n                <div style=\"padding:16px 20px;border-bottom:1px solid var(--line);\">\n                  <div style=\"font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px;\">What it may do on its own<\u002Fdiv>\n                  <textarea value=\"{{ agentScope }}\" sc-camel-on-change=\"{{ agentScopeChange }}\" placeholder=\"What can it decide and do without a person checking first?\" style=\"width:100%;min-height:64px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.55;color:var(--ink);background:#fff;resize:vertical;\"><\u002Ftextarea>\n                  <div style=\"font-size:11.5px;color:var(--ink3);margin-top:7px;line-height:1.5;\">Required. Digicow will not approve an agent without this.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:16px 20px;border-bottom:1px solid var(--line);\">\n                  <div style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;\">What happens once it is approved<\u002Fdiv>\n                  <sc-for list=\"{{ agentTerms }}\" as=\"t\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex;gap:9px;font-size:12.5px;color:var(--ink2);line-height:1.55;margin-bottom:7px;\"><span style=\"color:var(--ink3);\">·<\u002Fspan><span style=\"min-width:0;\">{{ t }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;\">\n                  <button sc-camel-on-click=\"{{ submitAgent }}\" style=\"padding:10px 17px;border:none;background:{{ agentBtnBg }};color:#fff;border-radius:7px;font-size:13px;font-weight:600;cursor:{{ agentBtnCursor }};opacity:{{ agentBtnOpacity }};\">Submit for approval<\u002Fbutton>\n                  <span style=\"font-size:11.5px;color:var(--ink3);\">Digicow approves every agent individually. It is not automatic.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ agentPending }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;\">\n                <div style=\"display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);\">\n                  <div style=\"font-size:13.5px;font-weight:600;min-width:0;overflow-wrap:anywhere;\">{{ agentNameOut }}<\u002Fdiv>\n                  <span style=\"font-size:10.5px;font-weight:600;color:var(--brass);background:rgba(176,141,46,.14);border-radius:20px;padding:4px 10px;flex-shrink:0;\">Waiting for Digicow approval<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding:16px 20px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink2);line-height:1.65;\">Digicow is reviewing it as a new user in its own right, not as a request under your name. Until they approve it, the agent has no key, no permissions and no way to make a request.<\u002Fdiv>\n                <div style=\"padding:15px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n                  <button sc-camel-on-click=\"{{ admitAgent }}\" style=\"padding:7px 13px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;\">Approved<\u002Fbutton>\n                  <span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);\">Prototype · stands in for Digicow<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ agentLive }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;\">\n                <div style=\"display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;\">\n                  <div style=\"font-size:13.5px;font-weight:600;min-width:0;overflow-wrap:anywhere;\">{{ agentNameOut }}<\u002Fdiv>\n                  <span style=\"font-size:10.5px;font-weight:600;color:{{ agentStateColor }};background:{{ agentStateBg }};border-radius:20px;padding:4px 10px;flex-shrink:0;\">{{ agentState }}<\u002Fspan>\n                  <div style=\"flex:1;min-width:4px;\"><\u002Fdiv>\n                  <div style=\"font-family:var(--mono);font-size:10px;letter-spacing:.07em;color:var(--ink3);\">PRN-MER-A1<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ agentRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;flex-wrap:wrap;gap:8px 14px;padding:11px 20px;border-bottom:1px solid var(--line);\">\n                    <div style=\"flex:0 0 132px;min-width:100px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding-top:2px;\">{{ r.l }}<\u002Fdiv>\n                    <div style=\"flex:1 1 176px;min-width:0;font-size:12.5px;color:var(--ink);line-height:1.5;\">{{ r.v }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"padding:16px 20px;border-bottom:1px solid var(--line);\">\n                  <div style=\"display:flex;align-items:baseline;gap:8px;margin-bottom:9px;\">\n                    <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b8371;\">Taken so far<\u002Fspan>\n                    <span style=\"font-size:11px;color:var(--ink3);\">against what this agent is allowed in total<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:9px;\">\n                    <span style=\"flex:1 1 70px;min-width:56px;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;display:block;\">\n                      <span style=\"display:block;width:38%;height:8px;border-radius:4px;background:var(--brass);\"><\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"font-family:var(--mono);font-size:10.5px;color:var(--ink3);flex-shrink:0;\">38%<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:var(--ink2);line-height:1.65;text-wrap:pretty;\">Digicow watches the total, not just each request. Many small requests that are each fine on their own, but together add up to something you are not allowed to have, will be caught here.<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ agentRunning }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:15px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;\">\n                    <button sc-camel-on-click=\"{{ suspendAgent }}\" style=\"padding:8px 14px;border:1px solid var(--oxblood);background:#fff;color:var(--oxblood);border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Pause this agent<\u002Fbutton>\n                    <span style=\"font-size:11.5px;color:var(--ink3);\">Stops everything it is doing, and anything new, immediately.<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ agentStopped }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:16px 20px;background:rgba(184,57,91,.06);font-size:12.5px;color:var(--ink2);line-height:1.65;\">Paused. Two requests were running and both stopped where they were — each recorded as stopped, neither quietly finished. Nothing was deleted.<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isCompute }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fadeIn .25s ease;\">\n            <div style=\"border:1px solid var(--sage);border-radius:14px;background:rgba(29,122,110,.07);padding:17px 20px;margin-bottom:16px;\">\n              <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sage);margin-bottom:8px;\">Before you register anything<\u002Fdiv>\n              <div style=\"font-size:13px;color:var(--ink2);line-height:1.7;text-wrap:pretty;\">You can register your own computers, but nothing that touches Digicow data will ever run on them. All work on the data happens on Digicow computers, next to the data. Your own are for what you do with a model or file after you have collected it.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;\">\n              <div style=\"padding:13px 20px;border-bottom:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b8371;\">Digicow computers available for your work<\u002Fdiv>\n              <sc-for list=\"{{ computeRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;\">\n                  <div style=\"width:96px;flex-shrink:0;font-family:var(--mono);font-size:11.5px;color:var(--ink);\">{{ r.id }}<\u002Fdiv>\n                  <div style=\"flex:1;min-width:150px;font-size:12.5px;color:var(--ink2);line-height:1.45;\">{{ r.what }}<\u002Fdiv>\n                  <div style=\"flex:0 1 130px;min-width:100px;font-size:11.5px;color:var(--ink3);\">{{ r.meter }}<\u002Fdiv>\n                  <span style=\"flex-shrink:0;font-size:10.5px;font-weight:600;color:{{ r.color }};background:{{ r.bg }};border-radius:20px;padding:4px 10px;\">{{ r.state }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:14px 20px;font-size:11.5px;color:var(--ink3);line-height:1.6;\">Usage is counted per request and checked against your spending limit before anything runs. A request that would go over it is sent to a person to approve rather than run and billed anyway.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;\">\n              <button sc-camel-on-click=\"{{ registerCompute }}\" style=\"padding:10px 17px;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;\">Register your own computers<\u002Fbutton>\n              <span style=\"font-size:11.5px;color:var(--ink3);min-width:180px;flex:1;\">{{ computeNote }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isModels }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fadeIn .25s ease;\">\n            <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;\">\n              <div style=\"padding:13px 20px;border-bottom:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b8371;\">Models and recipes you have registered<\u002Fdiv>\n              <sc-for list=\"{{ broughtRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div style=\"padding:13px 20px;border-bottom:1px solid var(--line);\">\n                  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:5px;flex-wrap:wrap;\">\n                    <div style=\"font-size:12.5px;font-weight:600;color:var(--ink);min-width:0;overflow-wrap:anywhere;\">{{ r.name }}<\u002Fdiv>\n                    <span style=\"font-size:10.5px;font-weight:600;color:{{ r.color }};background:{{ r.bg }};border-radius:20px;padding:3px 9px;flex-shrink:0;\">{{ r.kind }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px;color:var(--ink3);line-height:1.5;margin-bottom:5px;\">{{ r.what }}<\u002Fdiv>\n                  <div style=\"font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ink3);overflow-wrap:anywhere;\">{{ r.hash }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:14px 20px;font-size:11.5px;color:var(--ink3);line-height:1.6;\">The fingerprint taken when an item arrives is quoted again when your trained model is released, so you can be sure it is the same thing. Your ownership of what you bring is recorded on the way in and confirmed on the way out.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;\">\n              <button sc-camel-on-click=\"{{ registerModel }}\" style=\"padding:10px 17px;border:none;background:var(--blue);color:#fff;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;\">Register a base model<\u002Fbutton>\n              <span style=\"font-size:11.5px;color:var(--ink3);min-width:180px;flex:1;\">{{ modelNote }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isAvail }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fadeIn .25s ease;\">\n            <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px 14px;padding:11px 20px;border-bottom:1px solid var(--line);background:var(--surface);\">\n                <div style=\"flex:1 1 150px;min-width:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);\">Resource<\u002Fdiv>\n                <div style=\"flex:0 0 128px;min-width:96px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);\">Counted by<\u002Fdiv>\n                <div style=\"flex:0 0 118px;min-width:88px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);\">Price<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ availRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;\">\n                  <div style=\"flex:1;min-width:180px;\">\n                    <div style=\"font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:3px;overflow-wrap:anywhere;\">{{ r.name }}<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:var(--ink3);line-height:1.5;\">{{ r.what }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 0 128px;min-width:96px;font-size:12px;color:var(--ink2);\">{{ r.meter }}<\u002Fdiv>\n                  <div style=\"flex:0 0 118px;min-width:88px;font-size:12px;color:{{ r.priceColor }};\">{{ r.price }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:14px 20px;font-size:11.5px;color:var(--brass);line-height:1.6;\">Digicow has not set its rates yet, so nothing here shows a price. Your usage is still counted precisely — what, how much, and when — so it can be billed correctly once rates are set.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isPolicies }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fadeIn .25s ease;\">\n            <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;\">\n              <div style=\"padding:13px 20px;border-bottom:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b8371;\">What governs access<\u002Fdiv>\n              <sc-for list=\"{{ govPolicyRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:8px 16px;padding:13px 20px;border-bottom:1px solid var(--line);\">\n                  <div style=\"flex:0 0 160px;min-width:120px;font-size:12.5px;font-weight:600;color:var(--ink);padding-top:1px;\">{{ r.l }}<\u002Fdiv>\n                  <div style=\"flex:1 1 220px;min-width:0;font-size:12.5px;color:var(--ink2);line-height:1.55;\">{{ r.v }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:15px 20px;font-size:11.5px;color:var(--ink3);line-height:1.6;\">Ask Shield if you need the current text of a specific rule — the summaries above are a guide, not the rule itself.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isContract }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fadeIn .25s ease;\">\n            <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;\">\n              <div style=\"padding:13px 20px;border-bottom:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b8371;\">How your agreement maps to access<\u002Fdiv>\n              <sc-for list=\"{{ govContractRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:8px 16px;padding:13px 20px;border-bottom:1px solid var(--line);\">\n                  <div style=\"flex:0 0 160px;min-width:120px;font-size:12.5px;font-weight:600;color:var(--ink);padding-top:1px;\">{{ r.l }}<\u002Fdiv>\n                  <div style=\"flex:1 1 220px;min-width:0;font-size:12.5px;color:var(--ink2);line-height:1.55;\">{{ r.v }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:15px 20px;font-size:11.5px;color:var(--ink3);line-height:1.6;\">These categories are why the same estate can show different totals to different partners — each one is checked against your specific terms, not a shared default.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isCollection }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fadeIn .25s ease;\">\n            <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;\">\n              <div style=\"padding:13px 20px;border-bottom:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b8371;\">Where the data comes from<\u002Fdiv>\n              <sc-for list=\"{{ govCollectionRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:8px 16px;padding:13px 20px;border-bottom:1px solid var(--line);\">\n                  <div style=\"flex:0 0 160px;min-width:120px;font-size:12.5px;font-weight:600;color:var(--ink);padding-top:1px;\">{{ r.l }}<\u002Fdiv>\n                  <div style=\"flex:1 1 220px;min-width:0;font-size:12.5px;color:var(--ink2);line-height:1.55;\">{{ r.v }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:15px 20px;font-size:11.5px;color:var(--ink3);line-height:1.6;\">Collection method does not change what you can access — that is still governed by the Rulebook and your contract — but it explains the Collection period shown on each estate.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isExtract }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex-shrink:0;border-top:1px solid var(--line);background:#fff;padding:13px clamp(16px,2.4vw,28px) 16px;\">\n          <div style=\"max-width:860px;display:flex;align-items:center;gap:7px;margin-bottom:8px;\">\n            <span style=\"width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;\"><\u002Fspan>\n            <span style=\"font-size:11.5px;font-weight:600;color:var(--accent);\">Assistance<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"max-width:860px;display:flex;gap:8px;align-items:center;\">\n            <input value=\"{{ chatInput }}\" sc-camel-on-change=\"{{ chatChange }}\" sc-camel-on-key-down=\"{{ chatKey }}\" placeholder=\"{{ chatPlaceholder }}\" style=\"flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;color:var(--ink);background:#fff;\">\n            <button sc-camel-on-click=\"{{ chatSend }}\" style=\"padding:10px 15px;border:none;background:var(--blue);color:#fff;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;\">Send<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"width:clamp(236px,26%,330px);min-width:0;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;\">\n      <sc-if value=\"{{ railIsNotes }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;min-height:0;flex:1;\">\n          <div style=\"padding:16px 18px;border-bottom:1px solid var(--line);flex-shrink:0;\">\n            <div style=\"font-size:13px;font-weight:600;color:var(--ink);\">{{ notesTitle }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.45;\">{{ notesSub }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div id=\"dap-rail\" style=\"flex:1;min-height:0;overflow-y:auto;padding:16px 18px 26px;\">\n            <sc-for list=\"{{ notes }}\" as=\"n\" hint-placeholder-count=\"4\">\n              <div style=\"margin-bottom:18px;\">\n                <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:6px;\">\n                  <span style=\"width:14px;height:2px;border-radius:1px;background:{{ n.color }};flex-shrink:0;\"><\u002Fspan>\n                  <span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:{{ n.color }};\">{{ n.tag }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--ink2);line-height:1.65;text-wrap:pretty;\">{{ n.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"border:1px solid var(--line);border-radius:11px;background:#fff;padding:14px 15px;\">\n              <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b8371;margin-bottom:10px;\">Your usage so far<\u002Fdiv>\n              <sc-for list=\"{{ historyRows }}\" as=\"h\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:8px;\">\n                  <span style=\"flex:1;min-width:0;font-size:12px;color:var(--ink3);\">{{ h.l }}<\u002Fspan>\n                  <span style=\"font-family:var(--mono);font-size:11px;color:var(--ink);flex-shrink:0;\">{{ h.v }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"font-size:11.5px;color:var(--ink3);line-height:1.55;margin-top:10px;\">Kept for as long as you have access. Digicow can see it at any time.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ railIsChat }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;min-height:0;flex:1;\">\n :[['What you send in','A question or objective'],['What you get back','Findings and analysis — not the records they came from'],['How it is checked','Results only state what the data genuinely supports'],\n      ['Who has to sign off','Nobody, unless the data includes personal or confidential details'],['What goes on the record','Your question, the answer, and which records were used']],\n    practice:'Which records were used is noted on your receipt, but the records themselves cannot be reconstructed from what you receive. If a question cannot be answered without exposing them, Digicow declines rather than giving you a watered-down answer.',\n    practiceBg:'rgba(76,95,213,.06)',\n    objPlaceholder:'What do you want to find out?',\n    objHint:'Results are held to what the data can actually support. Anything it cannot answer comes back as a clear gap, not a guess.',\n    fallback:'How AI conception rates differ by bull breed across the livestock records, with the records used cited.',\n    fields:[['What you get','Structured findings, with the records used cited'],['Confidence','Nothing is stated as fact that the data cannot back up']],\n    unit:'records read and words returned', terms:'Agreement MER-002',\n    prefix:'PRC', always:false, egress:false,\n    running:'Working through the data and assembling your findings.',\n    done:'Your findings are ready. They state what the data supports and nothing more, and the records used are listed on your receipt.',\n    greet:'I can help you sharpen the question before you submit it. Tell me what you want to find out and I will say what the data can answer.' },\n  finetune:{ label:'Train a Model', title:'Train a model', gate:'Always reviewed',\n    sub:'Your model comes to the data and trains here. You take the trained model away; the data never leaves Digicow.',\n    rows:[['What you send in','Your base model, or one Digicow provides'],['What you get back','The trained model, with its usage rights attached'],\n      [' gn off','Digicow, every time — because a file leaves with you'],['What goes on the record','A fingerprint of the file, which records were used, and your agreement']],\n    practice:'The skill is developed against Digicow data and leaves as a file. The data it was developed on is listed on your receipt, not packed inside the file.',\n    practiceBg:'rgba(124,58,175,.05)',\n    objPlaceholder:'What should the skill do, step by step?',\n    objHint:'Spell out the procedure: what it decides, what it refuses, and when it hands over to a person.',\n    fallback:'Answer common farmer questions from the survey Q&A library by topic, and pass anything it cannot handle to a trainer.',\n    fields:[['What you get','A versioned, runnable skill file'],['Development data','Read here at Digicow · never bundled into the file']],\n    unit:'records read', terms:'Agreement MER-009',\n    prefix:'SKL', always:true, egress:true,\n    running:'Building the skill against Digicow data. The data is read here and is not written into the file.',\n    done:'Your skill is built and ready to collect. The file carries its fingerprint; the data it was built on is listed on your receipt.',\n    greet:'Tell me what the skill should do and where it should stop. Once you submit, the description is fixed.' }\n};\n\nconst CONNECT_PROFILE = [\n  ['What you send in','Your queries'],['What you get back','Results, with identifying details removed'],['How it is checked','Every query runs on Digicow systems and is screened on the way back'],\n  ['Who has to sign off','Nobody, unless a query touches personal or confidential data'],['What goes on the record','Every query and every result']\n];\n\nconst NOTES = {\n  landing:[\n    {tag:'What needs sign-off', color:'var(--brass)', text:'3.49 million more records can be used if Digicow approves the specific request. Anything containing a name, ID number, or contact detail falls here — most of the catalogue does.'},\n    {tag:'The biggest set', color:'var(--blue)', text:'Training & Engagement records are the largest single group — farmer training history, group sessions, and survey responses, at just over two million records.'},\n    {tag:'What you can use today', color:'var(--sage)', text:'518,386 records are open to you now, no sign-off needed: the livestock and health records, plus DigiCow training audio and video library.'},\n    {tag:'Looking is free', color:'var(--ink3)', text:'Nothing on this page is the data itself. You are reading a summary, and browsing it is not recorded beyond a simple access log.'}\n  ],\n  extract:[\n    {tag:'Choose by what you take away', color:'var(--blue)', text:'The four options differ in what you leave with: findings, a trained model, a skill file, or copies of the data itself — roughly in order of how much review each gets.'},\n    {tag:'Submitted means fixed', color:'var(--brass)', text:'Whichever you choose, your request is fixed once you submit it. Need more later? That is a new request. The assistant cannot stretch an existing one.'},\n    {tag:'Two always need sign-off', color:'var(--sage)', text:'Training a model and building a skill both mean something leaves with you, so Digicow reviews them every time, whatever data they use.'}\n  ],\n  connect:[\n    {tag:'Where the line is', color:'var(--blue)', text:'What you connect is admitted to Digicow systems to work there. Digicow data never flows the other way into your systems.'},\n    {tag:'Agents are different', color:'var(--oxblood)', text:'An AI agent gets its own account, its own permissions and its own monitoring — it is not an extension of your login.'},\n    {tag:'Keys belong to people', color:'var(--sage)', text:'Each key is issued to one named person, does what that person is allowed to do, and can be revoked instantly.'}\n  ],\n  agents:[\n    {tag:'Its own account', color:'var(--oxblood)', text:'Your agent is registered separately from you, with its own permissions. Digicow can pause it without touching your access.'},\n

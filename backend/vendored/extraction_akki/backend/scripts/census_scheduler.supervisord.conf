; census_scheduler.supervisord.conf
;
; PHASE 3 CENSUS AUTONOMY SERVICE · supervisord program declaration.
;
; Owner R-106 §1 verbatim (banked in STATE/DECISIONS.md at 4k Commit-B
; f775adf6): "A supervisor-managed persistent worker/scheduler process
; (e.g., a census_scheduler service registered in supervisord alongside
; backend) that survives agent absence, app restarts, and pod restarts —
; census runs happen with NO agent in the loop."
;
; Deploy: copy this file into /etc/supervisor/conf.d/census_scheduler.conf
; and run `supervisorctl reread && supervisorctl update`.

[program:census_scheduler]
command=/root/.venv/bin/python -m services.census_autonomy.scheduler_program
directory=/app/assessment_workspace/repos/Extraction-Akki/backend
autostart=true
autorestart=true
environment=PYTHONPATH="/app/assessment_workspace/repos/Extraction-Akki/backend",CENSUS_AUTONOMY_STATE_DIR="/app/assessment_workspace/phase0/census_autonomy_state",CENSUS_SCHEDULER_POLL_INTERVAL_SEC="60",CENSUS_SCHEDULER_JOB_MAX_SEC="3600"
stderr_logfile=/var/log/supervisor/census_scheduler.err.log
stdout_logfile=/var/log/supervisor/census_scheduler.out.log
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
priority=200
